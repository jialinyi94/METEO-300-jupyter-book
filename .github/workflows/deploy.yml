# Build the book with notebook execution, then deploy it to GitHub Pages.
# GitHub Pages settings: Source = GitHub Actions.

name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # BASE_URL is the path of the site under the domain.
  # https://<user>.github.io/<repo> needs BASE_URL=/<repo>. A site at the domain root needs BASE_URL=''.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site (execute notebooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The readers in meteo300.data read data/samples/ instead of the network.
      METEO300_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Chinese labels in Matplotlib figures. meteo300.plot selects Noto Sans CJK SC.
      - name: Install the CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # Allowed network use on the first build: MetPy station tables and cartopy Natural
      # Earth files that data/natural_earth does not hold. The cache keeps them for later builds.
      - name: Restore the MetPy and cartopy download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/metpy
            ~/.local/share/cartopy
          key: downloads-${{ hashFiles('uv.lock') }}
          restore-keys: |
            downloads-

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --frozen

      # mystmd keys its execution cache on the code of each page.
      # The key also holds the lock file, the package code and the data samples,
      # because a change to them can change the outputs of unchanged pages.
      - name: Restore the notebook execution cache
        uses: actions/cache@v6
        with:
          path: _build/execute
          key: myst-exec-${{ hashFiles('uv.lock', 'src/**', 'data/samples/**') }}-${{ hashFiles('docs/**/*.md', '*.md') }}
          restore-keys: |
            myst-exec-${{ hashFiles('uv.lock', 'src/**', 'data/samples/**') }}-

      - name: Build HTML with notebook execution
        run: uv run --frozen jupyter-book build --html --execute --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  checks:
    name: Writing standard and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METEO300_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --frozen

      - name: Writing standard (STYLE.md)
        run: uv run --frozen python tools/ste_check.py

      - name: Unit tests
        run: uv run --frozen pytest -q

      - name: pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
