# Jupytext lets Jupyter open the book pages (docs/**/*.md) as notebooks.
# Each page declares its format in the frontmatter:
#   jupytext.text_representation.format_name: myst
# The filter keeps every mystmd frontmatter key (title, authors, ...) when Jupyter saves a page,
# and drops the editor-only keys.
notebook_metadata_filter = "all,-language_info,-widgets,-varInspector,-toc,-vscode,-colab,-jupytext.text_representation.jupytext_version"
