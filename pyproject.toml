[project]
name = "meteo300"
version = "0.1.0"
description = "A data book: atmospheric science with real data, for AI weather analysts"
authors = [{ name = "Jialin Yi" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "matplotlib",
    "metpy",
    "pint",
    "pint-xarray",
    "cartopy",
    "netcdf4",
    "zarr",
    "gcsfs",
    "ipykernel",
    "jupyter-book>=2,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "jupytext",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meteo300"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Code cells of a notebook page import packages in later cells, as notebooks do.
"docs/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
