[project]
name = "meteo300"
version = "0.1.0"
description = "A data book: atmospheric science with real data, for AI weather analysts"
authors = [{ name = "Jialin Yi" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    # MetPy 1.7.1 StationPlot breaks with Matplotlib 3.11 (Text._get_layout changed).
    "matplotlib>=3.10,<3.11",
    "metpy",
    "pint",
    "pint-xarray",
    "cartopy",
    "netcdf4",
    "zarr",
    "gcsfs",
    "ipykernel",
    "jupyter-book>=2,<3",
    "siphon>=0.11.0",
    "ecmwf-opendata>=0.3.35",
    "cfgrib>=0.9.15.1",
    "s3fs>=2026.9.0",
    "satpy>=0.60.0",
    # h5netcdf >= 1.8 makes h5py optional. Without h5py, engine="h5netcdf" cannot open files.
    "h5netcdf[h5py]>=1.8.1",
    "earthaccess>=0.19.0",
    "cdsapi>=0.7.7",
    "eumdac>=3.1.1",
    "requests>=2.34.2",
    "xeofs>=3.0.4",
    "tephi>=0.4.0",
    # Import rule: import meteo300 (or pyproj) before eccodes, cfgrib or earthkit.
    # eccodes >= 2.43 and earthkit-geo load eckitlib, which brings its own copy of the PROJ
    # and SQLite libraries. pyproj brings another copy. When the eckitlib copy loads first,
    # the process crashes at exit (double free or segmentation fault). When pyproj loads
    # first, it does not. meteo300/__init__.py imports pyproj first, and warns when eccodes
    # came before it. tests/test_environment.py checks both orders.
    "eccodes>=2.50.0",
    "earthkit-data>=1.3.0",
    "earthkit-geo>=1.2.0",
    "earthkit-meteo[scores]>=1.2.1",
    "earthkit-plots>=1.0.4",
    "earthkit-transforms>=1.0.0",
    # "import earthkit.transforms" imports geopandas, but the package does not require it.
    "geopandas>=1.0",
    # Without ipywidgets, "import tqdm.auto" in a notebook warns "IProgress not found".
    # "import metpy.calc" imports pooch, and pooch imports tqdm.auto.
    "ipywidgets>=8",
    "pvlib>=0.16.1",
    "climlab>=0.9.2",
    # climlab imports six, but the package does not require it.
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "jupytext",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meteo300"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
# meteo300 imports come before all third-party imports: meteo300 loads pyproj before eccodes.
# See the import rule in the dependencies above.
sections = { "meteo300" = ["meteo300"] }
section-order = ["future", "standard-library", "meteo300", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pyflakes]
# "import meteo300" alone is useful: it loads pyproj before eccodes.
allowed-unused-imports = ["meteo300"]

[tool.ruff.lint.per-file-ignores]
# Code cells of a notebook page import packages in later cells, as notebooks do.
# Figure captions in "#| caption:" cell options are long Chinese lines, so pages skip E501.
"docs/**" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests download data; run them with: uv run pytest -m network
markers = ["network: downloads data from the internet"]
addopts = "-m 'not network'"

[tool.ste_check]
# Settings of tools/ste_check.py, the automatic checks of STYLE.md.
paths = ["intro.md", "README.md", "docs"]
exclude = []
glossary = "glossary.md"
zh_max_chars = 40
en_max_words = 25
max_sentences = 6
# A sentence with this many numbers or more is a number list. Its numbers do not count.
number_list_min = 3
# Words that contain a rejected term but have a different meaning.
allow = ["陆地表面", "自相关系数", "偏相关系数"]
