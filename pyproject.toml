[project]
name = "meteo-300-jupyter-book"
version = "0.1.0"
description = "A jupyter book for PSU METEO-300"
authors = [
    {name = "Jialin Yi",email = "jialinyi@sas.upenn.edu"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.0,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "metpy (>=1.7.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "xarray (>=2025.12.0,<2026.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]
