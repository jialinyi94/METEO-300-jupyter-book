# Install once:  uv run pre-commit install
# Run on all files:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # data/ holds sample and shapefile data files; the text fixers must not change them.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]

  # The local hooks use the tool versions in uv.lock.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-md-notebooks
        name: ruff check (code cells in MyST notebooks)
        entry: uv run --frozen tools/ruff_md.sh
        language: system
        files: ^docs/.*\.md$
      - id: ste-check
        name: writing standard (STYLE.md)
        entry: uv run --frozen python tools/ste_check.py
        language: system
        files: ^(intro\.md|README\.md|docs/.*\.md)$
      - id: ste-check-all
        name: writing standard, all pages (glossary or checker changed)
        entry: uv run --frozen python tools/ste_check.py
        language: system
        files: ^(glossary\.md|tools/ste_check\.py|pyproject\.toml)$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        files: ^(glossary\.md|tools/.*|tests/.*|src/.*)$
        pass_filenames: false
