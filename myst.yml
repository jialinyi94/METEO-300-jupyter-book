# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 8af17319-8168-40c6-bf42-bf1935b58e70

  # ---------------------------------------------------------------------------------------------
  # Title, subtitle and authors: decided 2026-10-17 (ALP-423).
  # Change them here only. No other file repeats them.
  title: 从 ERA5 到 AI 天气模型
  subtitle: 用真实数据学大气科学
  authors:
    - name: Jialin Yi
  # ---------------------------------------------------------------------------------------------

  description: 一本用真实数据学大气科学的数据书。每页给出真实数据、最常用的数据集、处理数据的软件包，以及它和 AI 天气模型的联系。
  keywords: ["atmospheric science", "ERA5", "AI weather models", "METEO 300", "MetPy", "xarray"]
  github: https://github.com/jialinyi94/METEO-300-jupyter-book
  # The text adapts METEO 300 (CC BY-NC-SA 4.0), so the content uses the same licence.
  # The code uses MIT. Full texts: LICENSE-CONTENT and LICENSE.
  license:
    content: CC-BY-NC-SA-4.0
    code: MIT
  # BibTeX for every DOI the pages link to. With it, the build does not ask doi.org,
  # which fails at random in CI. Add an entry when a page links a new DOI.
  bibliography:
    - references.bib
  numbering:
    figure:
      template: 图 %s
    table:
      template: 表 %s
    equation:
      template: 式 %s
    exercise:
      template: 练习 %s
  # Paths in the TOC are relative to this file. Page agents write exactly these files.
  toc:
    - file: intro.md
    - title: 气压与热力学
      children:
        - file: docs/topics/ch01-global-circulation.md
        - file: docs/topics/ch02-station-observations.md
        - file: docs/topics/ch03-pressure-hydrostatic.md
        - file: docs/topics/ch04-thermodynamics-stability.md
    - title: 动力学、水汽与稳定度
      children:
        - file: docs/topics/ch05-dynamics-geostrophic.md
        - file: docs/topics/ch06-water-vapour.md
        - file: docs/topics/ch07-stability-tephigram.md
        - file: docs/topics/t1-cloud-composition.md
    - title: 位势高度、向量微积分与热成风
      children:
        - file: docs/topics/ch08-geopotential-thickness.md
        - file: docs/topics/ch09-vector-calculus.md
        - file: docs/topics/ch10-thermal-wind.md
        - file: docs/topics/t2-radiation.md
    - title: 边界层、涡度与温带气旋
      children:
        - file: docs/topics/t3-boundary-layer.md
        - file: docs/topics/ch11-vorticity-divergence.md
        - file: docs/topics/ch12-extratropical-cyclone.md
    - title: 参考
      children:
        - file: docs/reference/datasets.md
        - file: docs/reference/toolkits.md
        - file: docs/reference/data-access-demo.md
        - file: docs/reference/glossary.md
        - file: docs/reference/style.md

site:
  template: book-theme
  options:
    # Logo files come from tools/make_logo.py. favicon.ico is the logo at 16, 32 and 48 px.
    logo: assets/logo.svg
    logo_dark: assets/logo-dark.svg
    logo_text: 从 ERA5 到 AI 天气模型
    favicon: assets/favicon.ico
  parts:
    # Replaces "Made with MyST" at the bottom of the left sidebar.
    primary_sidebar_footer: assets/sidebar-footer.md
